<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DES 암호화 실험 (16진수)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f0f7ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1200px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #5c6bc0;
            margin-bottom: 30px;
            text-align: center;
        }
        h3 {
            color: #7986cb;
            margin-bottom: 20px;
        }
        .form-label {
            color: #5c6bc0;
            font-weight: 500;
        }
        .form-control {
            border-color: #e8eaf6;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #7986cb;
            box-shadow: 0 0 0 0.2rem rgba(121,134,203,0.25);
        }
        .btn-primary {
            background-color: #7986cb;
            border-color: #7986cb;
            padding: 8px 20px;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #5c6bc0;
            border-color: #5c6bc0;
            transform: translateY(-2px);
            transition: all 0.3s;
        }
        .result-box {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .result-label {
            color: #5c6bc0;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .result-value {
            font-family: 'Consolas', monospace;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #e8eaf6;
        }
        .error-message {
            color: #f44336;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #ffebee;
        }
        .input-hint {
            font-size: 0.85em;
            color: #7986cb;
            margin-top: 5px;
            font-style: italic;
        }
        .hex-value {
            color: #5c6bc0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-success {
            background-color: #81c784;
            border-color: #81c784;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-success:hover {
            background-color: #66bb6a;
            border-color: #66bb6a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DES 암호화 실험 (16진수)</h1>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <div class="row">
            <div class="col-md-6">
                <h3>암호화</h3>
                <form id="encryptForm" method="POST" action="/encrypt">
                    <div class="mb-3">
                        <label for="plaintext" class="form-label">평문 (16진수):</label>
                        <input type="text" class="form-control" id="plaintext" name="plaintext" value="{{ plaintext }}" placeholder="예: 0123456789ABCDEF">
                    </div>
                    <div class="mb-3">
                        <label for="key" class="form-label">키 (16진수):</label>
                        <input type="text" class="form-control" id="key" name="key" value="{{ key }}" placeholder="예: 133457799BBCDFF1">
                    </div>
                    <button type="submit" class="btn btn-primary">암호화</button>
                </form>
                {% if ciphertext %}
                <div class="result-box">
                    <div class="result-label">암호문 (16진수):</div>
                    <div class="result-value">{{ ciphertext }}</div>
                </div>
                {% endif %}
            </div>
            
            <div class="col-md-6">
                <h3>복호화</h3>
                <form id="decryptForm" method="POST" action="/decrypt">
                    <div class="mb-3">
                        <label for="ciphertext" class="form-label">암호문 (16진수):</label>
                        <input type="text" class="form-control" id="ciphertext" name="ciphertext" value="{{ ciphertext }}" placeholder="암호문을 입력하세요">
                    </div>
                    <div class="mb-3">
                        <label for="key" class="form-label">키 (16진수):</label>
                        <input type="text" class="form-control" id="key" name="key" value="{{ key }}" placeholder="예: 133457799BBCDFF1">
                    </div>
                    <button type="submit" class="btn btn-primary">복호화</button>
                </form>
                {% if decrypted %}
                <div class="result-box">
                    <div class="result-label">복호화된 평문 (16진수):</div>
                    <div class="result-value">{{ decrypted }}</div>
                </div>
                {% endif %}
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/round1" class="btn btn-primary">Round 1 계산 과정 보기</a>
            <a href="/ones_complement" class="btn btn-primary">1의 보수 암호화 실험</a>
            <a href="/weak_keys" class="btn btn-primary">DES 취약키 테스트</a>
            <a href="/semi_weak_keys" class="btn btn-primary">DES 준취약키 테스트</a>
        </div>
    </div>

    <script>
        function isValidHex(str) {
            return /^[0-9A-Fa-f]+$/.test(str);
        }

        function validateKey(key) {
            if (!isValidHex(key)) {
                alert('키는 16진수만 입력 가능합니다.');
                return false;
            }
            return true;
        }

        function validatePlaintext(plaintext) {
            if (!isValidHex(plaintext)) {
                alert('평문은 16진수만 입력 가능합니다.');
                return false;
            }
            return true;
        }

        function formatHex(hex) {
            // 2자리씩 공백으로 구분하여 표시
            return hex.match(/.{1,2}/g).join(' ');
        }

        async function encrypt() {
            const plaintext = document.getElementById('plaintext').value;
            const key = document.getElementById('key').value;
            
            if (!validateKey(key) || !validatePlaintext(plaintext)) {
                return;
            }
            
            try {
                const response = await fetch('/encrypt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ plaintext, key }),
                });
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('encrypted-result').textContent = formatHex(data.encrypted_text);
                    document.getElementById('encrypted-text').value = data.encrypted_text;
                } else {
                    alert('암호화 실패: ' + data.error);
                }
            } catch (error) {
                alert('오류 발생: ' + error);
            }
        }

        async function decrypt() {
            const encryptedText = document.getElementById('encrypted-text').value;
            const key = document.getElementById('key').value;
            
            if (!validateKey(key) || !isValidHex(encryptedText)) {
                alert('암호문은 16진수만 입력 가능합니다.');
                return;
            }
            
            try {
                const response = await fetch('/decrypt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ encrypted_text: encryptedText, key }),
                });
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('decrypted-result').textContent = formatHex(data.decrypted_text);
                } else {
                    alert('복호화 실패: ' + data.error);
                }
            } catch (error) {
                alert('오류 발생: ' + error);
            }
        }
    </script>
</body>
</html>
