<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DES Round 1 계산 과정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f0f7ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1400px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        .round1-section, .k1-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .step-box {
            border: 2px solid #7986cb;
            border-radius: 10px;
            padding: 15px;
            background-color: #f5f5f5;
            height: fit-content;
        }
        .step-title {
            color: #5c6bc0;
            font-weight: 500;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1em;
        }
        .binary-box {
            border: 1px solid #9fa8da;
            border-radius: 5px;
            padding: 10px;
            background-color: #ffffff;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            margin-bottom: 10px;
        }
        .input-section {
            margin-bottom: 30px;
            grid-column: 1 / -1;
        }
        .btn-calculate {
            background-color: #7986cb;
            border-color: #7986cb;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-calculate:hover {
            background-color: #5c6bc0;
            border-color: #5c6bc0;
            transform: translateY(-2px);
        }
        .section-title {
            color: #5c6bc0;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .binary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
        }
        .binary-row-4bit {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-4bit {
            width: 120px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-4col {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-4col {
            width: 60px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-1bit {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-1bit {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-4col-key {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-4col-key {
            width: 60px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-4bit-8row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-4bit-8row {
            width: 60px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-1bit-col {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-1bit-col {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-4bit-split {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-4bit-split {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-6col {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-6col {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-8x7 {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-8x7 {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
        .binary-row-8x6 {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .binary-cell-8x6 {
            width: 30px;
            text-align: center;
            border: 1px solid #e8eaf6;
            padding: 2px;
            font-family: 'Consolas', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DES Round 1 계산 과정</h1>
        
        <div class="input-section">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="plaintext" class="form-label">평문 (16진수):</label>
                        <input type="text" class="form-control" id="plaintext" placeholder="예: 0123456789ABCDEF">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="key" class="form-label">키 (16진수):</label>
                        <input type="text" class="form-control" id="key" placeholder="예: 133457799BBCDFF1">
                    </div>
                </div>
            </div>
            <div class="text-center">
                <button class="btn btn-calculate" onclick="calculateRound1()">계산하기</button>
            </div>
        </div>

        <div class="main-grid">
            <div class="round1-section">
                <h3 class="section-title">Round 1 과정</h3>
                <div class="step-box">
                    <div class="step-title">평문 (이진수)</div>
                    <div class="binary-box" id="plaintext-binary"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">1. 초기 순열 (IP)</div>
                    <div class="binary-box" id="ip-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">2. 좌우 분할</div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="binary-box" id="left-block"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="binary-box" id="right-block"></div>
                        </div>
                    </div>
                </div>

                <div class="step-box">
                    <div class="step-title">3. 확장 순열 (E)</div>
                    <div class="binary-box" id="expansion-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">4. 서브키 생성 (K1)</div>
                    <div class="binary-box" id="subkey-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">5. XOR 연산</div>
                    <div class="binary-box" id="xor-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">6. S-Box 치환</div>
                    <div class="binary-box" id="sbox-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">7. 순열 (P)</div>
                    <div class="binary-box" id="permutation-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">8. P 결과와 IP 왼쪽 XOR</div>
                    <div class="binary-box" id="p-ip-xor-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">9. 최종 결과</div>
                    <div class="binary-box" id="final-result"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">10. 최종 결과 (32비트 교환)</div>
                    <div class="binary-box" id="final-result-swapped"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">11. 최종 결과 (IP inverse)</div>
                    <div class="binary-box" id="final-result-ip-inverse"></div>
                </div>

                <div class="step-box">
                    <div class="step-title">12. 최종 결과 (16진수)</div>
                    <div class="binary-box" id="final-result-hex"></div>
                </div>
            </div>

            <div class="k1-section">
                <h3 class="section-title">K1 생성 과정</h3>
                <div class="step-box">
                    <div class="step-title">키 (이진수)</div>
                    <div class="binary-box" id="key-binary"></div>
                </div>
                
                <div class="step-box">
                    <div class="step-title">1. PC-1</div>
                    <div class="binary-box" id="pc1-result"></div>
                </div>
                
                <div class="step-box">
                    <div class="step-title">2. 좌우 분할</div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="binary-box" id="key-left-block"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="binary-box" id="key-right-block"></div>
                        </div>
                    </div>
                </div>
                
                <div class="step-box">
                    <div class="step-title">3. LS-1</div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="binary-box" id="key-left-ls1"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="binary-box" id="key-right-ls1"></div>
                        </div>
                    </div>
                </div>
                
                <div class="step-box">
                    <div class="step-title">4. PC-2</div>
                    <div class="binary-box" id="k1-result"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function hexToBinary(hex) {
            return hex.split('').map(h => 
                parseInt(h, 16).toString(2).padStart(4, '0')
            ).join('');
        }

        function createBinaryDisplay(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 8) {
                html += '<div class="binary-row">';
                for (let j = 0; j < 8; j++) {
                    const bit = binary[i + j];
                    html += `<div class="binary-cell">${bit}</div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay4Bit(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 4) {
                html += '<div class="binary-row-4bit">';
                const bits = binary.slice(i, i + 4);
                html += `<div class="binary-cell-4bit">${bits}</div>`;
                html += '</div>';
            }
            return html;
        }

        function createBinarySquare(title, binary) {
            const square = document.createElement('div');
            square.className = 'binary-square';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'binary-square-title';
            titleDiv.textContent = title;
            square.appendChild(titleDiv);
            
            const content = document.createElement('div');
            content.className = 'binary-square-content';
            
            for (let i = 0; i < binary.length; i++) {
                const cell = document.createElement('div');
                cell.className = 'binary-square-cell';
                cell.textContent = binary[i];
                content.appendChild(cell);
            }
            
            square.appendChild(content);
            return square;
        }

        function createBinaryDisplay4Col(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 7) {
                html += '<div class="binary-row-4col">';
                const bits = binary.slice(i, i + 7);
                html += `<div class="binary-cell-4col">${bits}</div>`;
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay1Bit(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i++) {
                html += '<div class="binary-row-1bit">';
                html += `<div class="binary-cell-1bit">${binary[i]}</div>`;
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay4ColKey(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 7) {
                html += '<div class="binary-row-4col-key">';
                const bits = binary.slice(i, i + 7);
                html += `<div class="binary-cell-4col-key">${bits}</div>`;
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay4Bit8Row(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 4) {
                html += '<div class="binary-row-4bit-8row">';
                const bits = binary.slice(i, i + 4);
                html += `<div class="binary-cell-4bit-8row">${bits}</div>`;
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay1BitCol(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i++) {
                html += '<div class="binary-row-1bit-col">';
                html += `<div class="binary-cell-1bit-col">${binary[i]}</div>`;
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay4BitSplit(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 4) {
                html += '<div class="binary-row-4bit-split">';
                const bits = binary.slice(i, i + 4);
                for (let j = 0; j < 4; j++) {
                    html += `<div class="binary-cell-4bit-split">${bits[j]}</div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay6Col(binary) {
            let html = '';
            for (let i = 0; i < binary.length; i += 6) {
                html += '<div class="binary-row-6col">';
                for (let j = 0; j < 6; j++) {
                    const bit = binary[i + j];
                    html += `<div class="binary-cell-6col">${bit}</div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay8x7(binary) {
            let html = '';
            for (let i = 0; i < 8; i++) {
                html += '<div class="binary-row-8x7">';
                for (let j = 0; j < 7; j++) {
                    const bit = binary[i * 7 + j];
                    html += `<div class="binary-cell-8x7">${bit}</div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function createBinaryDisplay8x6(binary) {
            let html = '';
            for (let i = 0; i < 8; i++) {
                html += '<div class="binary-row-8x6">';
                for (let j = 0; j < 6; j++) {
                    const bit = binary[i * 6 + j];
                    html += `<div class="binary-cell-8x6">${bit}</div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function calculateRound1() {
            const plaintext = document.getElementById('plaintext').value;
            const key = document.getElementById('key').value;
            
            if (!plaintext || !key) {
                alert('평문과 키를 모두 입력해주세요.');
                return;
            }
            
            // 평문을 이진수로 변환하여 표시
            const binaryPlaintext = hexToBinary(plaintext);
            document.getElementById('plaintext-binary').innerHTML = createBinaryDisplay(binaryPlaintext);
            
            // K1 생성 과정
            const binaryKey = hexToBinary(key);
            document.getElementById('key-binary').innerHTML = createBinaryDisplay(binaryKey);
            
            // 1. PC-1
            const pc1Table = [
                57, 49, 41, 33, 25, 17, 9,
                1, 58, 50, 42, 34, 26, 18,
                10, 2, 59, 51, 43, 35, 27,
                19, 11, 3, 60, 52, 44, 36,
                63, 55, 47, 39, 31, 23, 15,
                7, 62, 54, 46, 38, 30, 22,
                14, 6, 61, 53, 45, 37, 29,
                21, 13, 5, 28, 20, 12, 4
            ];
            
            let pc1Result = '';
            for (let i = 0; i < 56; i++) {
                pc1Result += binaryKey[pc1Table[i] - 1];
            }
            document.getElementById('pc1-result').innerHTML = createBinaryDisplay8x7(pc1Result);
            
            // 2. 좌우 분할
            const keyLeftBlock = pc1Result.slice(0, 28);
            const keyRightBlock = pc1Result.slice(28);
            document.getElementById('key-left-block').innerHTML = createBinaryDisplay4BitSplit(keyLeftBlock);
            document.getElementById('key-right-block').innerHTML = createBinaryDisplay4BitSplit(keyRightBlock);
            
            // 3. LS-1
            const keyLeftLS1 = keyLeftBlock.slice(1) + keyLeftBlock[0];
            const keyRightLS1 = keyRightBlock.slice(1) + keyRightBlock[0];
            document.getElementById('key-left-ls1').innerHTML = createBinaryDisplay4BitSplit(keyLeftLS1);
            document.getElementById('key-right-ls1').innerHTML = createBinaryDisplay4BitSplit(keyRightLS1);
            
            // 4. PC-2
            const pc2Table = [
                14, 17, 11, 24, 1, 5,
                3, 28, 15, 6, 21, 10,
                23, 19, 12, 4, 26, 8,
                16, 7, 27, 20, 13, 2,
                41, 52, 31, 37, 47, 55,
                30, 40, 51, 45, 33, 48,
                44, 49, 39, 56, 34, 53,
                46, 42, 50, 36, 29, 32
            ];
            
            const ls1Combined = keyLeftLS1 + keyRightLS1;
            let k1Result = '';
            for (let i = 0; i < 48; i++) {
                k1Result += ls1Combined[pc2Table[i] - 1];
            }
            document.getElementById('k1-result').innerHTML = createBinaryDisplay8x6(k1Result);
            
            // 1. 초기 순열 (IP)
            const ipTable = [
                58, 50, 42, 34, 26, 18, 10, 2,
                60, 52, 44, 36, 28, 20, 12, 4,
                62, 54, 46, 38, 30, 22, 14, 6,
                64, 56, 48, 40, 32, 24, 16, 8,
                57, 49, 41, 33, 25, 17, 9, 1,
                59, 51, 43, 35, 27, 19, 11, 3,
                61, 53, 45, 37, 29, 21, 13, 5,
                63, 55, 47, 39, 31, 23, 15, 7
            ];
            
            let ipResult = '';
            for (let i = 0; i < 64; i++) {
                ipResult += binaryPlaintext[ipTable[i] - 1];
            }
            document.getElementById('ip-result').innerHTML = createBinaryDisplay(ipResult);

            // 2. 좌우 분할
            const leftBlock = ipResult.slice(0, 32);
            const rightBlock = ipResult.slice(32);
            document.getElementById('left-block').innerHTML = createBinaryDisplay(leftBlock);
            document.getElementById('right-block').innerHTML = createBinaryDisplay(rightBlock);

            // 3. 확장 순열 (E)
            const expansionTable = [
                32, 1, 2, 3, 4, 5,
                4, 5, 6, 7, 8, 9,
                8, 9, 10, 11, 12, 13,
                12, 13, 14, 15, 16, 17,
                16, 17, 18, 19, 20, 21,
                20, 21, 22, 23, 24, 25,
                24, 25, 26, 27, 28, 29,
                28, 29, 30, 31, 32, 1
            ];
            let expandedBlock = '';
            for (let i = 0; i < 48; i++) {
                expandedBlock += rightBlock[expansionTable[i] - 1];
            }
            document.getElementById('expansion-result').innerHTML = createBinaryDisplay6Col(expandedBlock);

            // 4. 서브키 생성 (K1)
            document.getElementById('subkey-result').innerHTML = createBinaryDisplay8x6(k1Result);

            // 5. XOR 연산
            let xorResult = '';
            for (let i = 0; i < 48; i++) {
                xorResult += (parseInt(expandedBlock[i]) ^ parseInt(k1Result[i])).toString();
            }
            document.getElementById('xor-result').innerHTML = createBinaryDisplay6Col(xorResult);

            // 6. S-Box 치환
            const sBoxes = [
                [
                    [14, 4, 13, 1, 2, 15, 11, 8, 3, 10, 6, 12, 5, 9, 0, 7],
                    [0, 15, 7, 4, 14, 2, 13, 1, 10, 6, 12, 11, 9, 5, 3, 8],
                    [4, 1, 14, 8, 13, 6, 2, 11, 15, 12, 9, 7, 3, 10, 5, 0],
                    [15, 12, 8, 2, 4, 9, 1, 7, 5, 11, 3, 14, 10, 0, 6, 13]
                ],
                [
                    [15, 1, 8, 14, 6, 11, 3, 4, 9, 7, 2, 13, 12, 0, 5, 10],
                    [3, 13, 4, 7, 15, 2, 8, 14, 12, 0, 1, 10, 6, 9, 11, 5],
                    [0, 14, 7, 11, 10, 4, 13, 1, 5, 8, 12, 6, 9, 3, 2, 15],
                    [13, 8, 10, 1, 3, 15, 4, 2, 11, 6, 7, 12, 0, 5, 14, 9]
                ],
                [
                    [10, 0, 9, 14, 6, 3, 15, 5, 1, 13, 12, 7, 11, 4, 2, 8],
                    [13, 7, 0, 9, 3, 4, 6, 10, 2, 8, 5, 14, 12, 11, 15, 1],
                    [13, 6, 4, 9, 8, 15, 3, 0, 11, 1, 2, 12, 5, 10, 14, 7],
                    [1, 10, 13, 0, 6, 9, 8, 7, 4, 15, 14, 3, 11, 5, 2, 12]
                ],
                [
                    [7, 13, 14, 3, 0, 6, 9, 10, 1, 2, 8, 5, 11, 12, 4, 15],
                    [13, 8, 11, 5, 6, 15, 0, 3, 4, 7, 2, 12, 1, 10, 14, 9],
                    [10, 6, 9, 0, 12, 11, 7, 13, 15, 1, 3, 14, 5, 2, 8, 4],
                    [3, 15, 0, 6, 10, 1, 13, 8, 9, 4, 5, 11, 12, 7, 2, 14]
                ],
                [
                    [2, 12, 4, 1, 7, 10, 11, 6, 8, 5, 3, 15, 13, 0, 14, 9],
                    [14, 11, 2, 12, 4, 7, 13, 1, 5, 0, 15, 10, 3, 9, 8, 6],
                    [4, 2, 1, 11, 10, 13, 7, 8, 15, 9, 12, 5, 6, 3, 0, 14],
                    [11, 8, 12, 7, 1, 14, 2, 13, 6, 15, 0, 9, 10, 4, 5, 3]
                ],
                [
                    [12, 1, 10, 15, 9, 2, 6, 8, 0, 13, 3, 4, 14, 7, 5, 11],
                    [10, 15, 4, 2, 7, 12, 9, 5, 6, 1, 13, 14, 0, 11, 3, 8],
                    [9, 14, 15, 5, 2, 8, 12, 3, 7, 0, 4, 10, 1, 13, 11, 6],
                    [4, 3, 2, 12, 9, 5, 15, 10, 11, 14, 1, 7, 6, 0, 8, 13]
                ],
                [
                    [4, 11, 2, 14, 15, 0, 8, 13, 3, 12, 9, 7, 5, 10, 6, 1],
                    [13, 0, 11, 7, 4, 9, 1, 10, 14, 3, 5, 12, 2, 15, 8, 6],
                    [1, 4, 11, 13, 12, 3, 7, 14, 10, 15, 6, 8, 0, 5, 9, 2],
                    [6, 11, 13, 8, 1, 4, 10, 7, 9, 5, 0, 15, 14, 2, 3, 12]
                ],
                [
                    [13, 2, 8, 4, 6, 15, 11, 1, 10, 9, 3, 14, 5, 0, 12, 7],
                    [1, 15, 13, 8, 10, 3, 7, 4, 12, 5, 6, 11, 0, 14, 9, 2],
                    [7, 11, 4, 1, 9, 12, 14, 2, 0, 6, 10, 13, 15, 3, 5, 8],
                    [2, 1, 14, 7, 4, 10, 8, 13, 15, 12, 9, 0, 3, 5, 6, 11]
                ]
            ];

            let sboxResult = '';
            for (let i = 0; i < 8; i++) {
                const block = xorResult.slice(i * 6, (i + 1) * 6);
                const row = parseInt(block[0] + block[5], 2);
                const col = parseInt(block.slice(1, 5), 2);
                const value = sBoxes[i][row][col];
                sboxResult += value.toString(2).padStart(4, '0');
            }
            document.getElementById('sbox-result').innerHTML = createBinaryDisplay(sboxResult);

            // 7. 순열 (P)
            const permutationTable = [
                16, 7, 20, 21, 29, 12, 28, 17,
                1, 15, 23, 26, 5, 18, 31, 10,
                2, 8, 24, 14, 32, 27, 3, 9,
                19, 13, 30, 6, 22, 11, 4, 25
            ];
            let permutedResult = '';
            for (let i = 0; i < 32; i++) {
                permutedResult += sboxResult[permutationTable[i] - 1];
            }
            document.getElementById('permutation-result').innerHTML = createBinaryDisplay(permutedResult);

            // 8. P 결과와 IP 왼쪽 XOR
            let pIpXorResult = '';
            for (let i = 0; i < 32; i++) {
                pIpXorResult += (parseInt(permutedResult[i]) ^ parseInt(leftBlock[i])).toString();
            }
            document.getElementById('p-ip-xor-result').innerHTML = createBinaryDisplay(pIpXorResult);

            // 9. 최종 결과
            const finalResult = rightBlock + pIpXorResult;
            document.getElementById('final-result').innerHTML = createBinaryDisplay(finalResult);

            // 10. 최종 결과 (32비트 교환)
            const finalResultSwapped = pIpXorResult + rightBlock;
            document.getElementById('final-result-swapped').innerHTML = createBinaryDisplay(finalResultSwapped);

            // 11. IP inverse 순열
            const ipInverseTable = [
                40, 8, 48, 16, 56, 24, 64, 32,
                39, 7, 47, 15, 55, 23, 63, 31,
                38, 6, 46, 14, 54, 22, 62, 30,
                37, 5, 45, 13, 53, 21, 61, 29,
                36, 4, 44, 12, 52, 20, 60, 28,
                35, 3, 43, 11, 51, 19, 59, 27,
                34, 2, 42, 10, 50, 18, 58, 26,
                33, 1, 41, 9, 49, 17, 57, 25
            ];

            let finalResultIPInverse = '';
            for (let i = 0; i < 64; i++) {
                finalResultIPInverse += finalResultSwapped[ipInverseTable[i] - 1];
            }
            document.getElementById('final-result-ip-inverse').innerHTML = createBinaryDisplay(finalResultIPInverse);

            // 12. 16진수 변환
            let hexResult = '';
            for (let i = 0; i < finalResultIPInverse.length; i += 4) {
                const nibble = finalResultIPInverse.slice(i, i + 4);
                hexResult += parseInt(nibble, 2).toString(16).toUpperCase();
            }
            document.getElementById('final-result-hex').innerHTML = hexResult;
        }
    </script>
